name: Android APK Build

on:
  push:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Published, hash-locked runtime bundle (shadPS4 host build, Box64, FEXCore
  # smoke runners, etc). Building this whole stack from source in CI takes
  # hours and needs a Debian container (see android/README.md's "playstore
  # build packages existing runtime assets; it does not generate them").
  # We fetch the same prebuilt bundle install-host-jnilibs.mjs downloads by
  # default so the APK build stays fast and reliable.
  RUNTIME_RELEASE_URL: https://github.com/JICA98/Bachata-S4-Runtimes/releases/download/v0.1.0

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # NDK/CMake versions must match android/BachataS4/core/runtime/build.gradle.kts
          sdkmanager --install "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/BachataS4/**/*.gradle*', 'android/BachataS4/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download prebuilt runtime bundle
        run: |
          mkdir -p android/BachataS4/app/src/main/assets/runtime
          curl -fL -o android/BachataS4/app/src/main/assets/runtime/runtime.zip \
            "$RUNTIME_RELEASE_URL/runtime.zip"
          curl -fL -o android/BachataS4/app/src/main/assets/runtime/manifest.json \
            "$RUNTIME_RELEASE_URL/manifest.json"

      - name: Install Vortek build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libx11-dev zip

          # Ubuntu 24.04's packaged Vulkan headers predate extensions this
          # Vortek client source uses (e.g. VK_EXT_map_memory_placed), which
          # fails compilation with "unknown type name
          # VkPhysicalDeviceMapMemoryPlacedFeaturesEXT". Vortek doesn't link
          # against libvulkan.so (it *is* an ICD, not a loader consumer), so
          # fetch current upstream headers instead of the distro package.
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git \
            /tmp/vulkan-headers
          sudo mkdir -p /usr/include/vulkan
          sudo cp -r /tmp/vulkan-headers/include/vulkan/. /usr/include/vulkan/
          # vulkan_core.h includes vk_video/*.h, a sibling directory, not
          # part of include/vulkan/ itself.
          sudo mkdir -p /usr/include/vk_video
          sudo cp -r /tmp/vulkan-headers/include/vk_video/. /usr/include/vk_video/

          if [[ ! -f /usr/include/vulkan/vk_icd.h ]]; then
            sudo curl -fL -o /usr/include/vulkan/vk_icd.h \
              https://raw.githubusercontent.com/KhronosGroup/Vulkan-Loader/main/loader/generated/vk_icd.h \
              || sudo curl -fL -o /usr/include/vulkan/vk_icd.h \
              https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/main/include/vulkan/vk_icd.h
          fi

      - name: Build Vortek Vulkan client
        # The v0.1.0 published runtime bundle predates Vortek client support
        # (confirmed absent from its manifest.json), so runtime.zip is missing
        # host/lib/libvulkan_vortek.so. Build it from the pinned source per
        # runtime/scripts/build-vortek-client.sh and inject it below rather
        # than skip the check verify-native-fixes.mjs enforces on it.
        run: |
          winlator_revision=$(node -e '
            const lock = require("./runtime/locks/components.lock.json");
            process.stdout.write(lock.components.find((c) => c.name === "winlator-app").revision);
          ')
          runtime/scripts/checkout-component.sh winlator-app \
            https://github.com/JICA98/winlator-app.git "$winlator_revision"
          runtime/scripts/vendor-vortek.sh
          runtime/scripts/build-vortek-client.sh

      - name: Inject Vortek client into runtime bundle
        run: |
          stage="runtime/build/vortek-client-stage"
          zip_path="$(pwd)/android/BachataS4/app/src/main/assets/runtime/runtime.zip"
          manifest_path="android/BachataS4/app/src/main/assets/runtime/manifest.json"
          files=(
            host/lib/libvulkan_vortek.so
            host/vulkan/icd.d/vortek.json
            usr/share/bachata/vortek/SOURCE.txt
            usr/share/bachata/vortek/LICENSE
          )

          ( cd "$stage" && zip -r "$zip_path" "${files[@]}" )

          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const [manifestPath, stageDir, fileList] = process.argv.slice(1);
            const files = fileList.split(",");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            for (const rel of files) {
              const data = fs.readFileSync(`${stageDir}/${rel}`);
              const entry = { path: rel, size: data.length, sha256: crypto.createHash("sha256").update(data).digest("hex") };
              const idx = manifest.files.findIndex((f) => f.path === rel);
              if (idx >= 0) manifest.files[idx] = entry; else manifest.files.push(entry);
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
            console.log(`manifest.json updated with ${files.length} Vortek entries`);
          ' "$manifest_path" "$stage" "$(IFS=,; echo "${files[*]}")"

      - name: Install shadPS4 ARM64 (FEX) build dependencies
        run: |
          sudo dpkg --add-architecture arm64

          # Ubuntu doesn't serve arm64 packages from archive.ubuntu.com /
          # security.ubuntu.com (those are amd64-only) - they live on
          # ports.ubuntu.com instead. Without this, apt tries (and 404s)
          # fetching arm64 indices from the default amd64 mirrors.
          sudo sed -i 's/^Signed-By:/Architectures: amd64\nSigned-By:/' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates noble-security noble-backports' \
            'Components: main universe restricted multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null

          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm \
            libx11-dev:arm64 libxext-dev:arm64 libuuid1:arm64 libudev1:arm64 \
            libudev-dev:arm64 libstdc++-14-dev:arm64 uuid-dev:arm64

      - name: Build shadPS4 ARM64 (FEX) and FEXCore smoke runners
        # verify-apk-runtime.mjs also requires host/fexcore-smoke,
        # host/fexcore-guest-harness and host/shadps4-arm64-fex inside the
        # nested runtime.zip. None of these exist in the v0.1.0 release
        # either - it predates FEX/ARM64 support - so build them from
        # source. build-shadps4-arm64.sh builds fexcore-smoke and
        # fexcore-guest-harness internally as part of its own build.
        run: runtime/scripts/build-shadps4-arm64.sh

      - name: Inject shadPS4 ARM64 + FEXCore runners into runtime bundle
        # The v0.1.0 base bundle predates FEX/ARM64 support, so it carries
        # only whatever ARM64 host glibc libs an earlier host tool needed.
        # shadps4-arm64-fex / fexcore-smoke / fexcore-guest-harness pull in
        # additional runtime deps (libuuid.so.1, libudev.so.1, ...) that were
        # never part of that closure. Bundling only the three binaries here
        # and not their shared-library deps is exactly what produced the
        # on-device crash: "error while loading shared libraries: libuuid.so.1:
        # cannot open shared object file". Resolve the full ELF closure of the
        # new binaries and inject whatever isn't already in the manifest.
        run: |
          zip_path="$(pwd)/android/BachataS4/app/src/main/assets/runtime/runtime.zip"
          manifest_path="android/BachataS4/app/src/main/assets/runtime/manifest.json"
          stage=$(mktemp -d)
          mkdir -p "$stage/host"
          cp runtime/build/fexcore-smoke-stage/bin/fexcore-smoke "$stage/host/fexcore-smoke"
          cp runtime/build/fexcore-smoke-stage/bin/fexcore-guest-harness "$stage/host/fexcore-guest-harness"
          cp runtime/build/shadps4-arm64-stage/bin/shadps4-arm64 "$stage/host/shadps4-arm64-fex"
          files=(host/fexcore-smoke host/fexcore-guest-harness host/shadps4-arm64-fex)

          # Resolve the ARM64 shared-library closure of the newly built
          # binaries and stage any dependency not already present in the
          # current manifest (i.e. not already shipped by the base bundle).
          mapfile -t new_libs < <(node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const already = new Set(manifest.files.map((f) => f.path.replace(/^host\//, "")));
            const arm64Paths = ["/usr/lib/aarch64-linux-gnu", "/lib/aarch64-linux-gnu"];
            function findLib(soname) {
              for (const p of arm64Paths) {
                const full = `${p}/${soname}`;
                if (fs.existsSync(full)) return fs.realpathSync(full);
              }
              return null;
            }
            function needed(file) {
              try {
                return execFileSync("readelf", ["-d", file], { encoding: "utf8" })
                  .split("\n")
                  .map((l) => l.match(/Shared library: \[([^\]]+)\]/)?.[1])
                  .filter(Boolean);
              } catch { return []; }
            }
            const roots = process.argv.slice(2);
            const resolved = new Map();
            const queue = [...roots];
            const seen = new Set();
            while (queue.length) {
              const f = queue.shift();
              if (seen.has(f)) continue;
              seen.add(f);
              for (const soname of needed(f)) {
                if (resolved.has(soname) || already.has(soname)) continue;
                const lib = findLib(soname);
                if (!lib) { console.error(`WARN: unresolved ${soname} for ${f}`); continue; }
                resolved.set(soname, lib);
                queue.push(lib);
              }
            }
            for (const [soname, path] of resolved) console.log(`${soname}\t${path}`);
          ' "$manifest_path" \
            "$stage/host/shadps4-arm64-fex" \
            "$stage/host/fexcore-smoke" \
            "$stage/host/fexcore-guest-harness")

          for entry in "${new_libs[@]}"; do
            soname="${entry%%$'\t'*}"
            src="${entry#*$'\t'}"
            cp "$src" "$stage/host/$soname"
            files+=("host/$soname")
            echo "Bundling newly required ARM64 dep: $soname"
          done

          ( cd "$stage" && zip -r "$zip_path" "${files[@]}" )

          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const [manifestPath, stageDir, fileList] = process.argv.slice(1);
            const files = fileList.split(",");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            for (const rel of files) {
              const data = fs.readFileSync(`${stageDir}/${rel}`);
              const entry = { path: rel, size: data.length, sha256: crypto.createHash("sha256").update(data).digest("hex") };
              const idx = manifest.files.findIndex((f) => f.path === rel);
              if (idx >= 0) manifest.files[idx] = entry; else manifest.files.push(entry);
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
            console.log(`manifest.json updated with ${files.length} FEX entries`);
          ' "$manifest_path" "$stage" "$(IFS=,; echo "${files[*]}")"

      - name: Install host jniLibs from runtime bundle
        run: |
          node runtime/scripts/install-host-jnilibs.mjs \
            android/BachataS4/app/src/main/assets/runtime/runtime.zip

      - name: Build APK (Gradle)
        working-directory: android/BachataS4
        run: |
          chmod +x gradlew
          # verifyNativeRuntimeFixes* runs via ProcessBuilder.inheritIO(), whose
          # output Gradle's console isn't surfacing in CI. Exclude it here and
          # run the same script directly in the next step instead, so we get
          # its real stdout/stderr instead of a bare "exit 1".
          ./gradlew --console=plain test lintDebug assemblePlaystoreDebug \
            -x verifyNativeRuntimeFixesPlaystoreDebug

      - name: Verify native runtime fixes
        run: |
          node runtime/tests/verify-native-fixes.mjs \
            android/BachataS4/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk

      - name: Verify APK contents
        run: |
          node runtime/tests/verify-apk-runtime.mjs \
            android/BachataS4/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ps4droid-apk-${{ github.sha }}
          path: android/BachataS4/app/build/outputs/apk/playstore/debug/*.apk
