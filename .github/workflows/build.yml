name: Android APK Build

on:
  push:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld unzip zip

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/BachataS4/**/*.gradle*', 'android/BachataS4/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build shadPS4 core (x86_64)
        run: runtime/scripts/build-shadps4-x86_64.sh

      - name: Build Box64 host
        run: runtime/scripts/build-box64-host.sh

      - name: Package runtime
        run: node runtime/scripts/package-runtime.mjs

      - name: Verify runtime bundle
        run: node runtime/tests/verify-runtime.mjs runtime/locks/components.lock.json

      - name: Build APK (Gradle)
        working-directory: android/BachataS4
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assemblePlaystoreDebug

      - name: Verify APK contents
        run: |
          node runtime/tests/verify-apk-runtime.mjs \
            android/BachataS4/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ps4droid-apk-${{ github.sha }}
          path: android/BachataS4/app/build/outputs/apk/playstore/debug/*.apk
